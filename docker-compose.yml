services:
  db: # PostgreSQL database service
    # Deliberately NOT -alpine: alpine is musl, Render's managed Postgres is glibc, and
    # Postgres takes text collation from the OS locale. A musl/glibc split changes ORDER BY
    # on text columns (the API exposes ?sort=name) and btree index ordering. Keep this major
    # in step with production and with .github/workflows/backend-ci.yml.
    image: postgres:18
    container_name: postgres_db
    restart: always # Restart the container automatically if it fails
    environment: # Set environment variables from .env file
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes: # Persist data across container restarts
      # PG18+ stores data in major-version subdirectories and expects a single mount at
      # /var/lib/postgresql, not /var/lib/postgresql/data — mounting the old path makes it
      # refuse to start ("unused mount/volume"). See docker-library/postgres#1259.
      - db_data:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d # Initialize database with scripts
    ports: # Expose the standard PostgreSQL port
      - "5432:5432"
    healthcheck: # Verify PostgreSQL readiness before Node.js app connects
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: # Connect to the backend network
      - backend
    deploy: # Resource limits
      resources:
        limits:
          memory: 2048m
          cpus: "1"
    logging: # Configure logging to stdout
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis: # Redis service
    image: redis:7-alpine # Pinned to match backend-ci.yml; no collation semantics here
    container_name: redis_cache
    restart: always # Restart the container automatically if it fails
    environment: # Set environment variables from .env file
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # command: redis-server --requirepass ${REDIS_PASSWORD} # Set password for Redis
    volumes: # Persist data across container restarts
      - redis_data:/data # Default Redis data directory
    ports: # Expose the default Redis port
      - "6379:6379"
    networks: # Connect to the backend network
      - backend
    logging: # Configure logging to stdout
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq: # RabbitMQ message broker
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq_queue
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
      - "15692:15692" # Prometheus metrics
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app: # Node.js backend application service
    build: # Define build context and Dockerfile
      context: .
      dockerfile: Dockerfile.dev
    container_name: node_app
    restart: always # Restart the container automatically if it fails
    # `.env` and not `.env.development`: Compose's ${VAR} interpolation (used for the db
    # service's credentials above) reads only `.env` or the shell — never a service's
    # env_file. Using one file keeps the app's config and the database Compose creates
    # from drifting apart.
    env_file:
      - .env
    environment: # Set environment variables
      NODE_ENV: development # Run in development mode
      # `environment:` takes precedence over `env_file:`, which is what makes one shared
      # .env workable: the file holds host-facing values (127.0.0.1) for commands you run
      # on your machine — migrations, npm run dev — and these override the handful that
      # must instead resolve to Compose service names inside the container network.
      PORT: 5000
      DB_HOST: db
      DEVELOPMENT_DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_HOST: redis
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
    depends_on: # Ensure dependencies are running before starting the app
      db:
        condition: service_healthy
      redis:
        condition: service_started # Redis doesn't have a built-in healthcheck like postgres
      rabbitmq:
        condition: service_healthy
    ports: # Expose the application port
      # Host 8001 -> container 5000. Host 5000 collides with AirPlay Receiver on macOS.
      - "8001:5000"
    networks: # Connect to the backend network
      - backend
    logging: # Configure logging to stdout
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker: # RabbitMQ consumer process (src/worker.ts)
    # Opt-in: `docker compose --profile worker up -d`. Two reasons it does not start with a
    # plain `up`. The app service keeps RABBITMQ_ENABLED=false, so locally nothing publishes
    # and a default-on worker would sit idle. And it shares this broker, vhost and queue
    # with the integration tests: a running worker consumes the test's message and looks
    # the metric up in the development database, so the queue test fails fast while one
    # is attached. Stop it (`docker compose stop worker`) before `npm test`.
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: node_worker
    restart: always
    command: ["npm", "run", "worker:dev"]
    # Same single-.env reasoning as the app service above.
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DB_HOST: db
      DEVELOPMENT_DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_HOST: redis
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      # worker.ts exits immediately when this is false. Set here, not in .env, so the
      # app service keeps its synchronous fallback.
      RABBITMQ_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks: # Define a dedicated Docker network
  backend:
    name: backend_network # Name the network

volumes: # Define named volumes for data persistence
  db_data:
    name: db_data_volume # Name the volume
  redis_data:
    name: redis_data_volume # Name the volume
  rabbitmq_data:
    name: rabbitmq_data_volume
