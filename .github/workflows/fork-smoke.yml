# Fork smoke — ADR-0051.
#
# Bootstraps this checkout as a fork, then runs the gates a fork's CI runs and the
# steps bootstrap-fork.sh prints,
# against services started from the fork's own Compose file and .env. The chain
# under test is bootstrap -> .env -> Compose -> .env.test, which service containers
# (as backend-ci.yml uses) would bypass by fixing the credentials in YAML.
#
# SaaS-readiness caveat C1 was closed once, then broke unnoticed, because nothing
# ran a fork and the break hides on any machine already running the upstream stack
# (audit-2026-09-29 § 5).
name: Fork Smoke

on:
  push:
    branches:
      - main
      - dev
      - staging
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "ci/**"
      - "docs/**"
      - "refactor/**"
  pull_request:
    branches:
      - main
      - dev
      - staging
  workflow_dispatch:

concurrency:
  group: fork-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork-smoke:
    name: Fork bootstrap and npm test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # A hyphenated name, so the database-identifier slug (ADR-0051) is exercised.
      - name: Bootstrap as a fork
        run: bash scripts/bootstrap-fork.sh --name my-app

      - name: Start services from the fork's Compose file
        run: docker compose up -d --wait db redis rabbitmq

      - name: Install dependencies
        run: npm ci

      # The gates the fork's own CI runs, not only its tests. A fork's
      # docs:openapi:check failed for as long as this job skipped them
      # (audit 2026-10-03, S2): bootstrap renamed the spec's path and not the file.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: OpenAPI spec consistency
        run: npm run docs:openapi:check

      # The check above passes on any spec the generator reproduces, the
      # upstream's included. This proves the spec names the fork, and that the
      # gate does not depend on what the shell exports (audit 2026-10-05, T2).
      # The name is read from package.json because a fork's own run of this job
      # keeps the fork's name, not "my-app".
      - name: OpenAPI spec describes the fork
        run: |
          NAME="$(node -p "require('./package.json').name")"
          SPEC="docs/reference/api/${NAME}-openapi.json"
          test "$NAME" != "lakira-backend"
          grep -q "\"name\": \"${NAME%-backend}_refresh\"" "$SPEC"
          if grep -q '"title": "Lakira API"' "$SPEC"; then
            echo "The fork's spec still carries the upstream title." >&2
            exit 1
          fi
          APP_NAME=something-else npm run docs:openapi:check

      - name: Migrate the development database
        run: npm run migrate:development

      - name: Migrate the test database
        run: npm run db:migrate:test

      - name: Test
        run: npm test

      - name: Service logs
        if: failure()
        run: docker compose logs db rabbitmq
